[project]
name = "meta-shit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["images_parser"]


[project.scripts]
parse = "images_parser.scripts.app:main"
manage = "images_parser.scripts.tag:main"
